apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homepage-certificate
  namespace: envoy-gateway-system
spec:
  secretName: letsencrypt-prod-homepage-tls-secret
  dnsNames:
    - golebiowski.dev
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
