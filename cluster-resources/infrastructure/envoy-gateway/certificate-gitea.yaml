apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitea-certificate
  namespace: envoy-gateway-system
spec:
  secretName: letsencrypt-prod-gitea-tls-secret
  dnsNames:
    - gitea.golebiowski.dev
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
