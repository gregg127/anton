apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor-route
  namespace: harbor-registry
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: https-harbor
  hostnames:
    - harbor.golebiowski.dev
  rules:
    - backendRefs:
        - name: harbor
          port: 80
