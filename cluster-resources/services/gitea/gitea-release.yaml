---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 5m
  chart:
    spec:
      chart: gitea
      version: ">=v12.7.0 <13.0.0"
      sourceRef:
        kind: HelmRepository
        name: gitea
        namespace: gitea
      interval: 1m
  values:
    service:
      http:
        port: 3000
        type: ClusterIP
      ssh:
        port: 22
        type: ClusterIP
    gitea:
      admin:
        existingSecret: gitea-admin-secret
      config:
        APP_NAME: Gitea
        server:
          DOMAIN: gitea.golebiowski.dev
          DISABLE_SSH: true
        session:
          SAME_SITE: strict
        database:
          DB_TYPE: postgres
          HOST: postgres-headless
          NAME: gitea-gg
          USER: gitea-gg
          SCHEMA: public
        service:
          DISABLE_REGISTRATION: true
          REGISTER_MANUAL_CONFIRM: true
          DEFAULT_USER_IS_RESTRICTED: true
      additionalConfigFromEnvs:
        - name: GITEA__DATABASE__PASSWD
          valueFrom:
            secretKeyRef:
              name: gitea-db-secret
              key: password
    persistence:
      enabled: false
    postgresql:
      enabled: false
    postgresql-ha:
      enabled: false
    valkey-cluster:
      enabled: false
    valkey:
      enabled: false
